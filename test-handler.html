<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>RedTech — Diagnostic Email</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;padding:30px;margin:0;}
.card{background:#fff;border-radius:12px;padding:28px;max-width:560px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.1);}
h2{margin:0 0 4px;font-size:18px;}
p{color:#64748b;font-size:13px;margin:0 0 20px;}
.fg{margin-bottom:12px;}
label{font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:4px;}
input,select{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:13px;box-sizing:border-box;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{width:100%;padding:12px;background:#e63946;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
.btn:disabled{background:#94a3b8;cursor:not-allowed;}
.log{margin-top:16px;background:#0f172a;border-radius:8px;padding:16px;font-family:monospace;font-size:12px;color:#94a3b8;min-height:80px;white-space:pre-wrap;word-break:break-all;}
.ok{color:#4ade80;}.err{color:#f87171;}.info{color:#60a5fa;}.warn{color:#fbbf24;}
</style>
</head>
<body>
<div class="card">
  <h2>🔧 Diagnostic — clever-handler</h2>
  <p>Teste l'appel direct à la Edge Function pour identifier l'erreur exacte.</p>

  <div class="fg">
    <label>Email destinataire</label>
    <input type="email" id="email" value="idberka@live.com">
  </div>
  <div class="fg">
    <label>Nom résidence</label>
    <input type="text" id="nom" value="AGDAL">
  </div>
  <div class="row">
    <div class="fg">
      <label>Type</label>
      <select id="type" onchange="updateFields()">
        <optgroup label="Abonnements">
          <option value="bienvenue">✅ bienvenue</option>
          <option value="activation">🎉 activation</option>
          <option value="renouvellement">🔄 renouvellement</option>
          <option value="expiration_warning">⏰ expiration_warning</option>
          <option value="suspension">⛔ suspension</option>
        </optgroup>
        <optgroup label="Inscriptions">
          <option value="nouvelle_inscription">🔔 nouvelle_inscription</option>
          <option value="inscription_approuvee">✅ inscription_approuvee</option>
          <option value="inscription_refusee">❌ inscription_refusee</option>
        </optgroup>
        <optgroup label="Compte">
          <option value="reset_password">🔐 reset_password</option>
        </optgroup>
      </select>
    </div>
    <div class="fg">
      <label>Abonnement</label>
      <select id="abo">
        <option value="mensuel">mensuel</option>
        <option value="trimestriel">trimestriel</option>
        <option value="annuel">annuel</option>
      </select>
    </div>
  </div>

  <div id="residentFields" style="display:none;margin-bottom:12px;padding:12px;background:#f0f9ff;border-radius:8px;border:1px solid #bae6fd">
  <div style="font-size:11px;font-weight:700;color:#0369a1;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">Données résident (pour types inscription)</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div><label style="font-size:11px;font-weight:600;color:#64748b;display:block;margin-bottom:3px">Nom résident</label><input type="text" id="residentNom" value="Test Résident" style="width:100%;padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;box-sizing:border-box"></div>
    <div><label style="font-size:11px;font-weight:600;color:#64748b;display:block;margin-bottom:3px">Email résident</label><input type="email" id="residentEmail" value="resident@test.com" style="width:100%;padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;box-sizing:border-box"></div>
    <div><label style="font-size:11px;font-weight:600;color:#64748b;display:block;margin-bottom:3px">Appartement</label><input type="text" id="residentApt" value="5A" style="width:100%;padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;box-sizing:border-box"></div>
    <div><label style="font-size:11px;font-weight:600;color:#64748b;display:block;margin-bottom:3px">Téléphone</label><input type="text" id="residentTel" value="0600000000" style="width:100%;padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;box-sizing:border-box"></div>
  </div>
</div>
<div id="resetField" style="display:none;margin-bottom:12px;padding:12px;background:#faf5ff;border-radius:8px;border:1px solid #e9d5ff">
  <div style="font-size:11px;font-weight:700;color:#7c3aed;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Lien reset (pour reset_password)</div>
  <input type="url" id="resetUrl" value="https://missimi-living.vercel.app/reset-password.html?token=TEST123" style="width:100%;padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;box-sizing:border-box">
</div>
<button class="btn" id="btn" onclick="runTest()">🚀 Tester l'envoi</button>
  <div class="log" id="log">En attente du test...</div>
</div>

<script>
const FUNCTION_URL = 'https://nwusjraxjfirsonbndfy.supabase.co/functions/v1/clever-handler';
const INTERNAL_KEY = 'redtech-2026-secret';
const SB_ANON_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53dXNqcmF4amZpcnNvbmJuZGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODI5NjcsImV4cCI6MjA4OTI1ODk2N30.wqVBvGwrLv8bJfGuHJTWj1Upao63aTYQMcH-IIN7OGw';

function log(msg, cls) {
  var el = document.getElementById('log');
  var ts = new Date().toLocaleTimeString('fr-FR');
  el.innerHTML += '\n<span class="' + (cls||'info') + '">[' + ts + '] ' + msg + '</span>';
  el.scrollTop = el.scrollHeight;
}

function updateFields() {
  var type = document.getElementById('type').value;
  var inscTypes = ['nouvelle_inscription','inscription_approuvee','inscription_refusee'];
  document.getElementById('residentFields').style.display = inscTypes.includes(type) ? 'block' : 'none';
  document.getElementById('resetField').style.display = type === 'reset_password' ? 'block' : 'none';
}

async function runTest() {
  var btn = document.getElementById('btn');
  var logEl = document.getElementById('log');
  logEl.innerHTML = '';
  btn.disabled = true;
  btn.textContent = '⏳ Test en cours...';

  var email = document.getElementById('email').value.trim();
  var nom   = document.getElementById('nom').value.trim();
  var type  = document.getElementById('type').value;
  var abo   = document.getElementById('abo').value;

  var exp = new Date();
  exp.setDate(exp.getDate() + 30);
  var expStr = exp.toISOString().split('T')[0];

  var inscTypes = ['nouvelle_inscription','inscription_approuvee','inscription_refusee'];
  var payload = {
    type:            type,
    email:           email,
    nom:             nom,
    abonnement:      abo,
    date_expiration: expStr,
    jours_restants:  30,
    code_residence:  'RE-XX-7899'
  };
  // Ajouter champs résident si nécessaire
  if (inscTypes.includes(type)) {
    payload.resident_nom   = document.getElementById('residentNom').value;
    payload.resident_email = document.getElementById('residentEmail').value;
    payload.resident_apt   = document.getElementById('residentApt').value;
    payload.resident_tel   = document.getElementById('residentTel').value;
    // Pour inscription_approuvee/refusee, envoyer à l'email résident
    if (type !== 'nouvelle_inscription') {
      payload.email = document.getElementById('residentEmail').value;
    }
  }
  if (type === 'reset_password') {
    payload.reset_url = document.getElementById('resetUrl').value;
  }

  log('URL : ' + FUNCTION_URL, 'info');
  log('Payload : ' + JSON.stringify(payload), 'info');
  log('Header x-internal-key : ' + INTERNAL_KEY, 'info');
  log('--- Envoi en cours... ---', 'warn');

  // Test 1 : OPTIONS preflight manuel
  try {
    log('Test OPTIONS preflight...', 'info');
    var optResp = await fetch(FUNCTION_URL, { method: 'OPTIONS' });
    log('OPTIONS status : ' + optResp.status, optResp.ok ? 'ok' : 'err');
    var corsOrigin = optResp.headers.get('access-control-allow-origin');
    log('CORS Allow-Origin : ' + (corsOrigin || 'MANQUANT ⚠️'), corsOrigin ? 'ok' : 'err');
  } catch(e) {
    log('OPTIONS failed : ' + e.message, 'err');
  }

  // Test 2 : POST réel
  try {
    log('Test POST...', 'info');
    var resp = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-internal-key': INTERNAL_KEY,
        'Authorization': 'Bearer ' + SB_ANON_KEY
      },
      body: JSON.stringify(payload)
    });

    log('HTTP Status : ' + resp.status + ' ' + resp.statusText, resp.ok ? 'ok' : 'err');

    var text = await resp.text();
    log('Réponse brute : ' + text, resp.ok ? 'ok' : 'err');

    try {
      var data = JSON.parse(text);
      if (data.success) {
        log('✅ EMAIL ENVOYÉ ! ID : ' + data.id, 'ok');
      } else {
        log('❌ Erreur fonction : ' + JSON.stringify(data.error || data), 'err');
      }
    } catch(e) {
      log('⚠️ Réponse non-JSON : ' + text, 'warn');
    }

  } catch(e) {
    log('❌ FETCH FAILED : ' + e.message, 'err');
    log('→ Cause probable : CORS bloqué ou fonction inaccessible', 'warn');
    log('→ Vérifiez : Edge Function Settings → "Allow unauthenticated requests" = ON', 'warn');
  }

  btn.disabled = false;
  btn.textContent = '🚀 Tester l\'envoi';
}
</script>
</body>
</html>
