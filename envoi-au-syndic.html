<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réclamations - Résidence</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2c3e50; font-size: 24px; }
        .header p { color: #7f8c8d; margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; color: #2c3e50; margin-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 14px; outline: none; transition: border 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: #3498db; }
        textarea { height: 120px; resize: vertical; }
        .urgence-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .urgence-btn { padding: 8px 20px; border: 2px solid #ddd; border-radius: 20px; cursor: pointer; background: white; font-size: 13px; transition: all 0.3s; }
        .urgence-btn.faible { border-color: #27ae60; color: #27ae60; }
        .urgence-btn.moyenne { border-color: #f39c12; color: #f39c12; }
        .urgence-btn.haute { border-color: #e74c3c; color: #e74c3c; }
        .urgence-btn.selected.faible { background: #27ae60; color: white; }
        .urgence-btn.selected.moyenne { background: #f39c12; color: white; }
        .urgence-btn.selected.haute { background: #e74c3c; color: white; }
        .btn-envoyer { width: 100%; padding: 15px; background: #25D366; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn-envoyer:hover { background: #128C7E; }
        .btn-retour { width: 100%; padding: 12px; background: #95a5a6; color: white; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-retour:hover { background: #7f8c8d; }
        .etapes { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; }
        .etapes::before { content: ''; position: absolute; top: 17px; left: 15%; right: 15%; height: 2px; background: #ddd; z-index: 0; }
        .etape { text-align: center; flex: 1; position: relative; z-index: 1; }
        .etape-cercle { width: 35px; height: 35px; border-radius: 50%; background: #ddd; color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-weight: bold; transition: background 0.3s; }
        .etape.active .etape-cercle { background: #3498db; }
        .etape.done .etape-cercle { background: #27ae60; }
        .etape p { font-size: 11px; color: #7f8c8d; }
        .apercu { background: #f8f9fa; border-radius: 10px; padding: 15px; margin: 20px 0; border-left: 4px solid #25D366; display: none; }
        .apercu h3 { color: #25D366; margin-bottom: 10px; }
        .apercu-message { background: white; border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; border: 1px solid #e0e0e0; margin-bottom: 15px; }
        .succes { text-align: center; padding: 30px; display: none; }
        .succes .icone { font-size: 60px; margin-bottom: 15px; }
        .succes h2 { color: #27ae60; margin-bottom: 10px; }
        .succes p { color: #7f8c8d; margin-bottom: 5px; }
        .chargement { text-align: center; padding: 40px 20px; display: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .erreur { background: #ffeaea; border: 1px solid #e74c3c; border-radius: 10px; padding: 15px; color: #c0392b; margin-bottom: 15px; display: none; }
        .ticket { background: #eaf4fb; border-radius: 8px; padding: 10px 15px; margin: 10px 0; font-size: 13px; color: #2980b9; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>🏘️ Espace Réclamations</h1>
        <p>Résidence Les Jardins</p>
    </div>

    <div class="etapes">
        <div class="etape active" id="etape1">
            <div class="etape-cercle">1</div>
            <p>Formulaire</p>
        </div>
        <div class="etape" id="etape2">
            <div class="etape-cercle">2</div>
            <p>Analyse IA</p>
        </div>
        <div class="etape" id="etape3">
            <div class="etape-cercle">3</div>
            <p>Envoi WhatsApp</p>
        </div>
    </div>

    <div class="erreur" id="erreur">
        ⚠️ <span id="texte-erreur"></span>
    </div>

    <!-- FORMULAIRE -->
    <div id="formulaire">
        <div class="form-group">
            <label>👤 Votre Nom Complet</label>
            <input type="text" id="nom" placeholder="Ex: Mohamed Benali"/>
        </div>
        <div class="form-group">
            <label>🏠 Numéro d'Appartement</label>
            <input type="text" id="appartement" placeholder="Ex: Appartement 12 - Bâtiment B"/>
        </div>
        <div class="form-group">
            <label>📋 Type de Réclamation</label>
            <select id="type">
                <option value="">-- Choisissez --</option>
                <option value="panne">🔧 Panne / Réparation</option>
                <option value="bruit">🔊 Nuisance Sonore</option>
                <option value="proprete">🧹 Propreté des Parties Communes</option>
                <option value="ascenseur">🛗 Problème Ascenseur</option>
                <option value="eau">💧 Problème d'Eau</option>
                <option value="electricite">⚡ Problème Électricité</option>
                <option value="securite">🔒 Sécurité</option>
                <option value="autre">📝 Autre</option>
            </select>
        </div>
        <div class="form-group">
            <label>🚨 Niveau d'Urgence</label>
            <div class="urgence-buttons">
                <button class="urgence-btn faible" onclick="selectionnerUrgence('faible', this)">🟢 Faible</button>
                <button class="urgence-btn moyenne" onclick="selectionnerUrgence('moyenne', this)">🟡 Moyenne</button>
                <button class="urgence-btn haute" onclick="selectionnerUrgence('haute', this)">🔴 Urgente</button>
            </div>
        </div>
        <div class="form-group">
            <label>✍️ Décrivez votre Problème</label>
            <textarea id="description" placeholder="Décrivez votre problème en quelques mots..."></textarea>
        </div>
        <button class="btn-envoyer" onclick="traiterReclamation()">
            📱 Envoyer au Syndic via WhatsApp
        </button>
    </div>

    <!-- CHARGEMENT -->
    <div class="chargement" id="chargement">
        <div class="spinner"></div>
        <p id="texte-chargement">🤖 L'IA analyse votre réclamation...</p>
    </div>

    <!-- APERÇU -->
    <div class="apercu" id="apercu">
        <h3>📱 Message qui sera envoyé au Syndic :</h3>
        <div class="apercu-message" id="contenu-apercu"></div>
        <button class="btn-envoyer" onclick="envoyerWhatsApp()">
            ✅ Confirmer et Envoyer sur WhatsApp
        </button>
        <button class="btn-retour" onclick="retourFormulaire()">
            ✏️ Modifier ma réclamation
        </button>
    </div>

    <!-- SUCCÈS -->
    <div class="succes" id="succes">
        <div class="icone">✅</div>
        <h2>Réclamation Envoyée !</h2>
        <p>Le syndic a été notifié sur WhatsApp.</p>
        <p>Vous recevrez une réponse bientôt.</p>
        <div class="ticket" id="numero-ticket"></div>
        <br>
        <button class="btn-envoyer" onclick="nouvelleReclamation()">
            📝 Nouvelle Réclamation
        </button>
    </div>

</div>

<script>

    // ================================
    // CONFIGURATION
    // ================================
    const API_KEY = "sk-iu9NUvMo-BIArkIl4wZ7ww";
    const WHATSAPP_SYNDIC = "212649491945";

    let urgenceSelectionnee = "";
    let messageFinal = "";

    // ================================
    // SÉLECTIONNER L'URGENCE
    // ================================
    function selectionnerUrgence(niveau, bouton) {
        document.querySelectorAll(".urgence-btn")
            .forEach(btn => btn.classList.remove("selected"));
        bouton.classList.add("selected");
        urgenceSelectionnee = niveau;
    }

    // ================================
    // METTRE À JOUR LES ÉTAPES
    // ================================
    function mettreAJourEtapes(etapeActive) {
        for (let i = 1; i <= 3; i++) {
            const etape = document.getElementById(`etape${i}`);
            etape.classList.remove("active", "done");
            if (i < etapeActive) {
                etape.classList.add("done");
            } else if (i === etapeActive) {
                etape.classList.add("active");
            }
        }
    }

    // ================================
    // AFFICHER UNE ERREUR
    // ================================
    function afficherErreur(message) {
        const erreur = document.getElementById("erreur");
        document.getElementById("texte-erreur").textContent = message;
        erreur.style.display = "block";
        setTimeout(() => { erreur.style.display = "none"; }, 5000);
    }

    // ================================
    // GÉNÉRER UN NUMÉRO DE TICKET
    // ================================
    function genererTicket() {
        const date = new Date();
        const ticket = `REC-${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}-${Math.floor(Math.random()*9000)+1000}`;
        return ticket;
    }

    // ================================
    // TRAITER LA RÉCLAMATION
    // ================================

        // Récupérer les valeurs
        const nom = document.getElementById("nom").value.trim();
        const appartement = document.getElementById("appartement").value.trim();
        const type = document.getElementById("type").value;
        const description = document.getElementById("description").value.trim();

        // Vérifications
        if (!nom) { afficherErreur("Veuillez entrer votre nom complet."); return; }
        if (!appartement) { afficherErreur("Veuillez entrer votre numéro d'appartement."); return; }
        if (!type) { afficherErreur("Veuillez choisir le type de réclamation."); return; }
        if (!urgenceSelectionnee) { afficherErreur("Veuillez sélectionner le niveau d'urgence."); return; }
        if (!description) { afficherErreur("Veuillez décrire votre problème."); return; }

        document.getElementById("formulaire").style.display = "none";

            ascenseur: "Problème Ascenseur",
            eau: "Problème d'Eau",
            electricite: "Problème Électricité",
            securite: "Sécurité",
            autre: "Autre"
        };

        const urgenceLabels = {
            faible: "🟢 Faible",
            moyenne: "🟡 Moyenne",
            haute: "🔴
