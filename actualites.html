<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualités — Missimi Living</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<style>
:root{
  --gold:#c9a84c;--gold-light:#e8d5a3;--gold-bg:rgba(201,168,76,.08);
  --navy:#0d1b2a;--navy2:#1a2d42;--bg:#f8f9fc;--surface:#fff;
  --border:#e8eaf0;--text:#0d1b2a;--muted:#64748b;
  --radius:8px;--radius-lg:14px;--radius-xl:20px;
  --shadow:0 2px 8px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.05);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* NAVBAR */
nav{background:var(--navy);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.3);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nl-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#a07830);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:white;}
.nl-text{font-size:16px;font-weight:800;color:white;letter-spacing:-.02em;}
.nl-text span{color:var(--gold);}
.nav-links{display:flex;gap:6px;}
.nav-link{color:rgba(255,255,255,.55);font-size:13px;font-weight:500;padding:7px 14px;border-radius:7px;text-decoration:none;transition:all .2s;}
.nav-link:hover{background:rgba(255,255,255,.08);color:white;}
.nav-link.active{background:var(--gold-bg);color:var(--gold);font-weight:600;}
.nav-back{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.55);font-size:13px;text-decoration:none;padding:7px 14px;border-radius:7px;transition:all .2s;}
.nav-back:hover{background:rgba(255,255,255,.08);color:white;}

/* HERO */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);padding:56px 28px 48px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold-bg);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:11px;font-weight:700;padding:5px 14px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px;}
.hero h1{font-size:32px;font-weight:800;color:white;letter-spacing:-.03em;margin-bottom:8px;}
.hero p{font-size:15px;color:rgba(255,255,255,.5);max-width:480px;margin:0 auto;}

/* CONTENT */
.content{max-width:900px;margin:0 auto;padding:40px 20px 80px;}

/* FILTERS */
.filters{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap;}
.filter-btn{padding:7px 18px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-family:"Plus Jakarta Sans",sans-serif;transition:all .2s;}
.filter-btn:hover{border-color:var(--gold);color:var(--gold);}
.filter-btn.active{background:var(--navy);color:white;border-color:var(--navy);}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;}
.card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;cursor:pointer;}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.12);}
.card-img{width:100%;height:180px;object-fit:cover;background:linear-gradient(135deg,#1a2d42,#0d1b2a);display:flex;align-items:center;justify-content:center;font-size:48px;}
.card-img img{width:100%;height:180px;object-fit:cover;}
.card-body{padding:20px;}
.card-date{font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:500;}
.card-title{font-size:16px;font-weight:700;margin-bottom:8px;line-height:1.4;color:var(--text);}
.card-excerpt{font-size:13px;color:var(--muted);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.read-more{font-size:12px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:4px;}

/* MODAL ARTICLE */
.article-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.article-overlay.open{display:flex;}
.article-modal{background:var(--surface);border-radius:var(--radius-xl);max-width:680px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.am-img{width:100%;height:280px;object-fit:cover;background:linear-gradient(135deg,#1a2d42,#0d1b2a);display:flex;align-items:center;justify-content:center;font-size:64px;flex-shrink:0;}
.am-img img{width:100%;height:280px;object-fit:cover;}
.am-body{padding:28px 32px;}
.am-date{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:500;}
.am-title{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:16px;line-height:1.3;}
.am-content{font-size:15px;color:#374151;line-height:1.85;white-space:pre-wrap;}
.am-close{position:absolute;top:16px;right:16px;background:white;border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);}

/* EMPTY + LOADER */
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:16px;}
.loader{text-align:center;padding:60px;color:var(--muted);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:600px){
  .hero h1{font-size:24px;}
  .nav-links{display:none;}
  .grid{grid-template-columns:1fr;}
  .am-body{padding:20px;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="nl-icon">M</div>
    <span class="nl-text">Missimi <span>Living</span></span>
  </a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Accueil</a>
    <a href="projet.html" class="nav-link">Le projet</a>
    <a href="association.html" class="nav-link">Association</a>
    <a href="actualites.html" class="nav-link active">Actualités</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </div>
  <a href="index.html" class="nav-back">← Retour</a>
</nav>

<div class="hero">
  <div class="hero-badge">📰 Espace communautaire</div>
  <h1>Actualités Missimi Living</h1>
  <p>Restez informés des dernières nouvelles de votre résidence</p>
</div>

<div class="content">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all" onclick="filterActus('all',this)">Toutes</button>
    <button class="filter-btn" data-filter="recent" onclick="filterActus('recent',this)">🆕 Récentes</button>
  </div>

  <div id="articlesGrid" class="grid">
    <div class="loader"><div class="spinner"></div>Chargement...</div>
  </div>
</div>

<!-- Modal article -->
<div class="article-overlay" id="articleOverlay">
  <div class="article-modal" style="position:relative">
    <button class="am-close" id="closeArticle">×</button>
    <div id="amImg" class="am-img">📰</div>
    <div class="am-body">
      <div class="am-date" id="amDate">—</div>
      <div class="am-title" id="amTitle">—</div>
      <div class="am-content" id="amContent">—</div>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://nwusjraxjfirsonbndfy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53dXNqcmF4amZpcnNvbmJuZGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODI5NjcsImV4cCI6MjA4OTI1ODk2N30.wqVBvGwrLv8bJfGuHJTWj1Upao63aTYQMcH-IIN7OGw';
const db = supabase.createClient(SB_URL, SB_KEY);

var allArticles = [], currentFilter = 'all';

window.addEventListener('load', function() {
  loadArticles();

  document.getElementById('closeArticle').addEventListener('click', closeArticle);
  document.getElementById('articleOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeArticle();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeArticle();
  });
});

function loadArticles() {
  db.from('actualites')
    .select('*')
    .eq('publie', true)
    .order('created_at', { ascending: false })
    .then(function(res) {
      allArticles = res.data || [];
      renderArticles(allArticles);
    });
}

function filterActus(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  var filtered = allArticles;
  if (f === 'recent') {
    var cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
    filtered = allArticles.filter(function(a) { return new Date(a.created_at) >= cutoff; });
  }
  renderArticles(filtered);
}

function renderArticles(articles) {
  var grid = document.getElementById('articlesGrid');
  if (!articles.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📭</div><div>Aucune actualité pour le moment</div><div style="font-size:12px;margin-top:8px">Revenez bientôt !</div></div>';
    return;
  }
  grid.innerHTML = articles.map(function(a) {
    var date = new Date(a.created_at).toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'});
    var imgHtml = a.image_url
      ? '<div class="card-img"><img src="' + a.image_url + '" alt="' + a.titre + '" onerror="this.parentElement.innerHTML=\'📰\'"></div>'
      : '<div class="card-img">📰</div>';
    var excerpt = a.contenu.length > 120 ? a.contenu.substring(0, 120) + '...' : a.contenu;
    return '<div class="card" onclick="openArticle(\'' + a.id + '\')">' +
      imgHtml +
      '<div class="card-body">' +
        '<div class="card-date">📅 ' + date + '</div>' +
        '<div class="card-title">' + a.titre + '</div>' +
        '<div class="card-excerpt">' + excerpt + '</div>' +
      '</div>' +
      '<div class="card-footer">' +
        '<span class="read-more">Lire la suite →</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function openArticle(id) {
  var a = allArticles.find(function(x) { return x.id === id; });
  if (!a) return;
  var date = new Date(a.created_at).toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'});

  if (a.image_url) {
    document.getElementById('amImg').innerHTML = '<img src="' + a.image_url + '" alt="' + a.titre + '" onerror="this.parentElement.textContent=\'📰\'">';
  } else {
    document.getElementById('amImg').textContent = '📰';
  }
  document.getElementById('amDate').textContent    = '📅 ' + date;
  document.getElementById('amTitle').textContent   = a.titre;
  document.getElementById('amContent').textContent = a.contenu;
  document.getElementById('articleOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeArticle() {
  document.getElementById('articleOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
</script>
</body>
</html>
