<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — RedTech</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'DM Sans',sans-serif;
    background:#f5f4f1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  .box{
    background:white;
    border:1px solid #e3e1db;
    border-radius:14px;
    width:100%;
    max-width:400px;
    padding:36px 32px;
    box-shadow:0 4px 24px rgba(0,0,0,.10);
  }
  .logo{
    display:flex;align-items:center;justify-content:center;
    gap:8px;margin-bottom:24px;
  }
  .logo-icon{
    width:40px;height:40px;background:#e63946;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    color:white;font-weight:800;font-size:17px;flex-shrink:0;
  }
  .logo-txt{font-size:22px;font-weight:800;letter-spacing:-.03em;color:#0d1b2a;}
  .logo-txt span{color:#e63946;}
  h2{font-size:18px;font-weight:700;text-align:center;color:#1c1c1a;margin-bottom:5px;}
  .sub{font-size:13px;color:#78766e;text-align:center;margin-bottom:24px;line-height:1.6;}
  label{display:block;font-size:11px;font-weight:600;color:#78766e;
        text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
  .input-wrap{position:relative;margin-bottom:14px;}
  input[type=password],input[type=text]{
    width:100%;padding:10px 44px 10px 12px;
    font-size:14px;font-family:'DM Sans',sans-serif;
    border:1px solid #cac8c0;border-radius:7px;
    outline:none;transition:border .15s,box-shadow .15s;
  }
  input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1);}
  .eye-btn{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;font-size:16px;
    color:#78766e;padding:0;line-height:1;
  }
  .msg{
    display:none;font-size:13px;padding:11px 14px;border-radius:7px;
    margin-bottom:14px;border:1px solid;line-height:1.5;
  }
  .msg.error{background:#fef2f2;color:#b91c1c;border-color:#fecaca;}
  .msg.success{background:#f0fdf4;color:#15803d;border-color:#bbf7d0;}
  .msg.info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
  button.submit{
    width:100%;padding:12px;background:#2563eb;color:white;
    border:none;border-radius:7px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:'DM Sans',sans-serif;
    transition:background .15s;
  }
  button.submit:hover{background:#1d4ed8;}
  button.submit:disabled{background:#93c5fd;cursor:not-allowed;}
  .back-link{
    display:block;text-align:center;margin-top:14px;
    font-size:13px;color:#78766e;text-decoration:none;
  }
  .back-link:hover{color:#2563eb;}
  .rules{font-size:12px;color:#aba9a1;margin-bottom:16px;line-height:1.7;}
  .rules span{color:#78766e;font-weight:500;}
</style>
</head>
<body>
<div class="box">

  <div class="logo">
    <div class="logo-icon">R</div>
    <div class="logo-txt">Red<span>Tech</span></div>
  </div>

  <h2>Nouveau mot de passe</h2>
  <p class="sub">Choisissez un nouveau mot de passe sécurisé pour votre compte RedTech.</p>

  <div class="msg info" id="msgInfo" style="display:block;">
    🔑 Vérification du lien en cours...
  </div>

  <div id="formSection" style="display:none;">
    <div class="rules">
      Le mot de passe doit contenir <span>au moins 6 caractères</span>.
    </div>

    <label>Nouveau mot de passe</label>
    <div class="input-wrap">
      <input type="password" id="pwd1" placeholder="••••••••">
      <button type="button" class="eye-btn" onclick="toggleEye('pwd1',this)">👁</button>
    </div>

    <label>Confirmer le mot de passe</label>
    <div class="input-wrap">
      <input type="password" id="pwd2" placeholder="••••••••">
      <button type="button" class="eye-btn" onclick="toggleEye('pwd2',this)">👁</button>
    </div>

    <div class="msg" id="msg"></div>

    <button class="submit" id="submitBtn" onclick="updatePassword()">
      Enregistrer le nouveau mot de passe →
    </button>
  </div>

  <a href="syndic-v3.html" class="back-link">← Retour à la connexion</a>
</div>

<script>
  // ⚠️ REMPLACE CES DEUX VALEURS PAR LES TIENNES
  // Tu les trouves dans Supabase → Settings → API Keys
  const SUPABASE_URL = 'https://nwusjraxjfirsonbndfy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A8Re17ZjBi7-b8iZgnUceg_wGoeQJ77';

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Supabase lit automatiquement le token dans l'URL
  // et déclenche PASSWORD_RECOVERY si le lien est valide
  sb.auth.onAuthStateChange((event, session) => {
    const info = document.getElementById('msgInfo');
    const form = document.getElementById('formSection');

    if (event === 'PASSWORD_RECOVERY') {
      // Lien valide ✅
      info.style.display = 'none';
      form.style.display = 'block';
    } else if (event === 'SIGNED_IN' && session) {
      // Déjà connecté — rediriger
      window.location.href = 'syndic-v3.html';
    }
  });

  // Si après 3 secondes rien ne se passe, le lien est invalide/expiré
  setTimeout(() => {
    const info = document.getElementById('msgInfo');
    if (info.style.display !== 'none' && info.classList.contains('info')) {
      info.className = 'msg error';
      info.style.display = 'block';
      info.textContent = '❌ Lien invalide ou expiré. Demandez un nouveau lien depuis la page de connexion.';
    }
  }, 4000);

  async function updatePassword() {
    const pwd1 = document.getElementById('pwd1').value;
    const pwd2 = document.getElementById('pwd2').value;
    const btn  = document.getElementById('submitBtn');

    if (pwd1.length < 6) {
      showMsg('Le mot de passe doit contenir au moins 6 caractères.', 'error');
      return;
    }
    if (pwd1 !== pwd2) {
      showMsg('Les mots de passe ne correspondent pas.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Enregistrement...';

    const { error } = await sb.auth.updateUser({ password: pwd1 });

    if (error) {
      showMsg('❌ Erreur : ' + error.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Enregistrer le nouveau mot de passe →';
    } else {
      showMsg('✅ Mot de passe mis à jour avec succès ! Redirection...', 'success');
      btn.textContent = 'Mot de passe mis à jour ✓';
      setTimeout(() => window.location.href = 'syndic-v3.html', 2500);
    }
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.style.display = 'block';
    el.className = 'msg ' + type;
    el.textContent = text;
  }

  function toggleEye(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁';
    }
  }
</script>
</body>
</html>
