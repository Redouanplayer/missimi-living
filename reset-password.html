<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — RedTech</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      background: white;
      padding: 40px 36px;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 4px 32px rgba(0,0,0,.12);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .logo-icon {
      background: #ef4444;
      color: white;
      font-weight: 800;
      font-size: 18px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-txt { font-size: 22px; font-weight: 800; color: #1e293b; }
    .logo-txt span { color: #ef4444; }
    h2 { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 6px; text-align:center; }
    p.sub { font-size: 13px; color: #6b7280; text-align: center; margin-bottom: 24px; line-height: 1.6; }
    label { font-size: 11px; font-weight: 700; color: #374151; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
      transition: border .2s;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
    .msg {
      display: none;
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .msg.error { background: #fef2f2; color: #dc2626; }
    .msg.success { background: #f0fdf4; color: #16a34a; }
    button {
      width: 100%;
      padding: 13px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">
      <div class="logo-icon">R</div>
      <div class="logo-txt">Red<span>Tech</span></div>
    </div>
    <h2>Nouveau mot de passe</h2>
    <p class="sub">Choisissez un mot de passe sécurisé pour votre compte RedTech.</p>

    <label>Nouveau mot de passe</label>
    <input type="password" id="pwd1" placeholder="••••••••" minlength="6">

    <label>Confirmer le mot de passe</label>
    <input type="password" id="pwd2" placeholder="••••••••" minlength="6">

    <div class="msg" id="msg"></div>

    <button id="btn" onclick="updatePassword()">
      Enregistrer le nouveau mot de passe →
    </button>
  </div>

  <script>
    // ⚠️ Remplace ces 2 valeurs par les tiennes
    const SUPABASE_URL = 'https://XXXXXXXX.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Supabase lit automatiquement le token dans l'URL
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        showMsg('🔑 Lien valide. Entrez votre nouveau mot de passe.', 'success');
      }
    });

    async function updatePassword() {
      const pwd1 = document.getElementById('pwd1').value;
      const pwd2 = document.getElementById('pwd2').value;
      const btn  = document.getElementById('btn');

      if (pwd1.length < 6) {
        showMsg('Le mot de passe doit contenir au moins 6 caractères.', 'error');
        return;
      }
      if (pwd1 !== pwd2) {
        showMsg('Les mots de passe ne correspondent pas.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enregistrement...';

      const { error } = await sb.auth.updateUser({ password: pwd1 });

      if (error) {
        showMsg('❌ Erreur : ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Enregistrer le nouveau mot de passe →';
      } else {
        showMsg('✅ Mot de passe mis à jour ! Redirection vers la connexion...', 'success');
        setTimeout(() => window.location.href = '/syndic-v3.html', 2500);
      }
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.style.display = 'block';
      el.className = 'msg ' + type;
      el.textContent = text;
    }
  </script>
</body>
</html>
